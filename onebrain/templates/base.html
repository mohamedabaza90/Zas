<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ZAS OneBrain{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="logo">ZAS</span> OneBrain</a>
  <nav>
    {% set here = request.url.path %}
    <a href="/" class="{{ 'on' if here == '/' }}">الرئيسية</a>
    <a href="/projects" class="{{ 'on' if here.startswith('/projects') }}">المشروعات</a>
    <a href="/clients" class="{{ 'on' if here.startswith('/clients') }}">العملاء</a>
    <a href="/people" class="{{ 'on' if here.startswith('/people') }}">الموظفين</a>
    <a href="/audit" class="{{ 'on' if here.startswith('/audit') }}">سجل التغييرات</a>
  </nav>
</header>
<main class="wrap">
  {% if error %}<div class="alert">⚠️ {{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="foot">ZAS OneBrain — القسم 1: الأساس (قاعدة البيانات الموحدة). أي سجل عليه علامة «تجريبي» ليس بيانات حقيقية.</footer>
</body>
</html>
